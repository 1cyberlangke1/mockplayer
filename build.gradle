plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
    // Forgix：合并 fabric + neoforge 产物为单 jar（双端通用，发布用）
    id 'io.github.pacifistmc.forgix' version '2.0.0'
}

allprojects {
    repositories {
        // YACL 官方 Maven（可选配置界面库）
        maven { url = uri('https://maven.isxander.dev/releases') }
        // ModMenu 官方 Maven（Fabric 可选模组列表入口）
        maven { url = uri('https://maven.terraformersmc.com/releases') }
    }
}

// Pin the Gradle distribution to the Tencent mirror so `gradlew wrapper` / the IDE
// never overwrites distributionUrl back to services.gradle.org (slow/blocked in CN).
tasks.wrapper {
    distributionUrl = "https://mirrors.cloud.tencent.com/gradle/gradle-${gradleVersion}-bin.zip"
}

// Forgix：把 fabric + neoforge 双端 jar 合并成单 jar（见 Forgix README）
// 原理（Forgix 2.0.0）：同名不同内容的类自动改名（如 MockplayerMod_neoforge）+ TinyRemapper
// 同步重写字节码引用；mixin 配置/refmap/manifest 文本引用自动跟随；同内容文件去重；
// META-INF/services 合并 union。产物在 build/forgix/，只发布这一个 jar。
// autoRun=true：跑 gradle build/assemble/jar 时自动执行 mergeJars（root jar finalizedBy mergeJars）。
// 显式 inputJar（README 的 "automatic detection fails" 备选）：本仓库 build/libs 常年堆积
// 多版本产物 + 最新时间戳的 sources/javadoc，自动检测的时间惩罚（毫秒×0.15）会让
// 刚生成的 sources jar 反超主 jar（实测挑中 neoforge 的 -sources.jar，合并产物丢 @Mod 入口）。
// 26.x 全反混淆：双端生产 jar 都是 jar 任务（fabric Loom 无 remapJar，include 直接在 jar 里；
// neoforge ModDevGradle 自动 reobf + jarJar）。jar 产物含 baritone 嵌套：
// fabric META-INF/jars/、neoforge META-INF/jarjar/。
// inputJar 给文件路径，mergeJars 的 dependsOn 保证执行前产物已生成。
forgix {
    autoRun = true
    // 产物名带 MC 版本（tag 是仓库级共享空间，多 MC 版本分支并存时靠文件名区分）
    // → mockplayer-26.2-0.2.2-fabric-neoforge.jar
    archiveVersion = "${minecraft_version}-${version}"
    fabric {
        inputJar = rootProject.file(
                "fabric/build/libs/mockplayer-fabric-${minecraft_version}-${version}.jar")
    }
    neoforge {
        inputJar = rootProject.file(
                "neoforge/build/libs/mockplayer-neoforge-${minecraft_version}-${version}.jar")
    }
}

// inputJar 是文件路径，mergeJars 不知道要先构建 jar，手动补依赖。
// 用字符串路径（延迟解析），避免配置期访问子项目任务。
gradle.projectsEvaluated {
    rootProject.tasks.named('mergeJars').configure {
        dependsOn ':fabric:jar', ':neoforge:jar'
    }
}

// 完整性：baritone 日志翻译 key 必须存在于 lang 文件（新增消息未补翻译 → 构建失败，
// 保证运行时不存在「匹配不到翻译」的情况）
tasks.register('verifyBaritoneLang') {
    doLast {
        def keys = new HashSet()
        def keyArgCounts = new HashMap<String, Set<Integer>>()
        fileTree('vendor/baritone/src') { include '**/*.java' }.each { f ->
            def matcher = f.text =~ /(?:Component|net\.minecraft\.network\.chat\.Component)\.translatable(?:Escape)?\("([A-Za-z0-9_.]+)"/
            while (matcher.find()) {
                String k = matcher.group(1)
                keys.add(k)
                int args = countTranslatableArgs(f.text, matcher.start())
                keyArgCounts.computeIfAbsent(k, { new HashSet<Integer>() }).add(args)
            }
        }
        ['en_us', 'zh_cn'].each { lang ->
            def map = new groovy.json.JsonSlurper().parse(
                    file("vendor/baritone/src/main/resources/assets/baritone/lang/${lang}.json"))
            keys.each { k ->
                if (!map.containsKey(k)) {
                    throw new GradleException("baritone lang ${lang} 缺少翻译 key: ${k}")
                }
                int placeholders = (((String) map[k]) =~ /%\d*\$?s/).findAll().size()
                Set<Integer> counts = keyArgCounts[k]
                if (!counts.contains(placeholders)) {
                    throw new GradleException(
                            "baritone lang ${lang} key ${k} 占位符数量(${placeholders})与调用点参数数量(${counts})不匹配")
                }
            }
        }
        println "baritone 日志翻译完整性 OK: ${keys.size()} keys"
    }
}

// 统计 translatableEscape("key", ...) 调用点的参数个数（深度感知逗号分隔，忽略字符串内逗号）。
def countTranslatableArgs(String text, int keyStart) {
    int i = keyStart
    while (i < text.length() && text.charAt(i) != '(') {
        i++
    }
    int depth = 0
    int commas = 0
    boolean inStr = false
    char quote = 0 as char
    for (; i < text.length(); i++) {
        char c = text.charAt(i)
        if (inStr) {
            if (c == '\\') {
                i++
            } else if (c == quote) {
                inStr = false
            }
            continue
        }
        if (c == '"' || c == '\'') {
            inStr = true
            quote = c
            continue
        }
        if (c == '(') {
            depth++
        } else if (c == ')') {
            depth--
            if (depth == 0) {
                break
            }
        } else if (c == ',' && depth == 1) {
            commas++
        }
    }
    return commas
}
tasks.named('build') {
    dependsOn 'verifyBaritoneLang'
}
